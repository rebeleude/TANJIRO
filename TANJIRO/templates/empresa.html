<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TANJIRO | Nossa Empresa</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080000;
            color: white;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 25px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 0, 0, 0.2);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 5px;
            color: #ff2929;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
            font-size: 15px;
        }

        nav a:hover {
            color: #ff2929;
        }

        .conteudo {
            min-height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        .caixa {
            max-width: 850px;
            padding: 60px;
            background: #110505;
            border: 1px solid #321010;
            border-radius: 20px;
            box-shadow: 0 0 60px rgba(255, 0, 0, 0.08);
        }

        .caixa h1 {
            font-size: 55px;
            margin-bottom: 30px;
        }

        .caixa h1 span {
            color: #ff2929;
        }

        .caixa p {
            color: #c5c5c5;
            font-size: 18px;
            line-height: 1.9;
        }

        .voltar {
            display: inline-block;
            margin-top: 35px;
            padding: 14px 25px;
            border: 1px solid #ff2929;
            border-radius: 8px;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        .voltar:hover {
            background: #ff2929;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.4);
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #666;
            border-top: 1px solid #1d0808;
        }

    </style>

</head>

<body>

    <header>

        <div class="logo">
            TANJIRO
        </div>

        <nav>
            <a href="/">Início</a>
            <a href="/empresa">Empresa</a>
        </nav>

    </header>


    <section class="conteudo">

        <div class="caixa">

            <h1>
                Nossa <span>empresa.</span>
            </h1>

            <p>
                A TANJIRO é uma empresa que cria sites que divulgam sua marca.
                Nós da TANJIRO somos um grupo de pessoas qualificadas e
                preparadas para ajudar a sua empresa a crescer.
            </p>

            <a href="/" class="voltar">
                ← Voltar para o início
            </a>

        </div>

    </section>


    <footer>
        TANJIRO © 2026
    </footer>

</body>

</html>
